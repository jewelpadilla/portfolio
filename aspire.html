<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASPIRE | Jewel Padilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--ink:#2C2530;--ink-soft:#6B6070;
    --rose:#E0607E;--rose-deep:#C2476A;--blush:#FBEEF1;--line:#EFE7EA;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:980px;margin:0 auto;padding:0 28px}
  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:980px;margin:0 auto;padding:20px 28px}
  .logo{font-family:'Cedarville Cursive',cursive;font-weight:700;font-size:2rem;}
  .logo b{color:var(--rose)}
  .nav-links{display:flex;gap:30px;font-weight:600;font-size:.95rem}
  .nav-links a{color:var(--ink-soft);transition:color .15s}
  .nav-links a:hover{color:var(--rose-deep)}
  .hero{padding:120px 0 80px;text-align:center}
  .kicker{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose-deep);margin-bottom:20px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.02em;line-height:1.08;margin-bottom:24px}
  .coming{display:inline-block;background:var(--blush);color:var(--rose-deep);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 20px;border-radius:999px;margin-bottom:32px}
  .desc{color:var(--ink-soft);font-size:1.1rem;max-width:52ch;margin:0 auto 48px}
  .back{display:inline-block;color:var(--rose);font-weight:700;font-size:.95rem;border:1px solid var(--rose);padding:10px 24px;border-radius:999px;transition:background .18s,color .18s}
  .back:hover{background:var(--rose);color:#fff}
  footer{padding:40px 0;border-top:1px solid var(--line);text-align:center}
  footer .copy{color:var(--ink-soft);font-size:.95rem}
  footer .heart{color:var(--rose)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">Jewel<b>.</b></a>
    <div class="nav-links">
      <a href="index.html#work">Work</a>
      <a href="index.html#writings">Writings</a>
      <a href="index.html#about">About</a>
      <a href="mailto:jgpadill@ncsu.edu">Contact</a>
      <a href="CV_jewelpadilla.pdf" target="_blank">CV</a>
    </div>
  </div>
</nav>

<div class="wrap hero">
  <p class="kicker">Peer-reviewed · In revision</p>
  <h1>ASPIRE</h1>
  <span class="coming">coming soon</span>
  <p class="desc">More about this project is on the way. Check back soon.</p>
  <a class="back" href="index.html">← back to home</a>
</div>

<footer>
  <div class="wrap">
    <p class="copy">© 2026 with <span class="heart">❤</span> Jewel Padilla</p>
  </div>
</footer>

</body>
</html>
